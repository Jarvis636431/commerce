spring:
  application:
    name: commerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce}
    username: ${DB_USERNAME:commerce}
    password: ${DB_PASSWORD:commerce}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:commerce}
    password: ${RABBITMQ_PASSWORD:commerce}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  file:
    name: ${LOG_FILE:logs/commerce.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
  pattern:
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%p traceId=%X{traceId:-none} thread=%t logger=%logger{36} message=%m%n%wEx"

commerce:
  messaging:
    enabled: true
    outbox:
      poll-interval: 1000
      batch-size: 50
      lease: PT30S
      confirm-timeout: PT5S
      max-attempts: 10
      retry-initial-interval: PT2S
      retry-max-interval: PT5M
  security:
    issuer: commerce
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    jwt-secret: ${AUTH_JWT_SECRET:change-this-development-secret-at-least-32-bytes}
    permit-all: false
  cart:
    ttl: P30D
  product-cache:
    ttl: PT10M
    not-found-ttl: PT30S
    ttl-jitter: PT2M
  payment:
    timeout: PT15M
    timeout-scan-interval: 60000
