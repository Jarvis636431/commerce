spring:
  application:
    name: commerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce}
    username: ${DB_USERNAME:commerce}
    password: ${DB_PASSWORD:commerce}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:commerce}
    password: ${RABBITMQ_PASSWORD:commerce}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

commerce:
  messaging:
    enabled: true
  security:
    issuer: commerce
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
    jwt-secret: ${AUTH_JWT_SECRET:change-this-development-secret-at-least-32-bytes}
    permit-all: false
  cart:
    ttl: P30D
  product-cache:
    ttl: PT10M
    not-found-ttl: PT30S
    ttl-jitter: PT2M
  payment:
    timeout: PT15M
    timeout-scan-interval: 60000
