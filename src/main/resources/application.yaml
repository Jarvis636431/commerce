spring:
  application:
    name: commerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce}
    username: ${DB_USERNAME:commerce}
    password: ${DB_PASSWORD:commerce}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

commerce:
  cart:
    ttl: P30D
  product-cache:
    ttl: PT10M
    not-found-ttl: PT30S
    ttl-jitter: PT2M
  payment:
    timeout: PT15M
    timeout-scan-interval: 60000
