spring:
  datasource:
    url: jdbc:h2:mem:commerce;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    elasticsearch:
      repositories:
        enabled: false

commerce:
  search:
    enabled: false
  messaging:
    enabled: false
  security:
    permit-all: true
    jwt-secret: test-secret-that-is-longer-than-thirty-two-bytes
